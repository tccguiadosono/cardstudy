<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichas de Estudo — São Camilo Medicina 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C0392B;
    --red-dark: #922B21;
    --red-light: #FADBD8;
    --blue: #1A5276;
    --blue-mid: #2471A3;
    --blue-light: #D6EAF8;
    --green: #1E8449;
    --green-light: #D5F5E3;
    --orange: #D35400;
    --orange-light: #FDEBD0;
    --purple: #6C3483;
    --purple-light: #E8DAEF;
    --teal: #0E6655;
    --teal-light: #D1F2EB;
    --bg: #F8F6F2;
    --card-bg: #FFFFFF;
    --text: #1C1C1E;
    --text-muted: #6B6B6B;
    --border: #E5E0D8;
    --shadow: 0 4px 24px rgba(0,0,0,0.08), 0 1px 4px rgba(0,0,0,0.04);
    --shadow-hover: 0 12px 40px rgba(0,0,0,0.14), 0 2px 8px rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── HEADER ── */
  header {
    background: var(--red);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 20px rgba(192,57,43,0.3);
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 14px 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .header-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: white;
    font-weight: 700;
    flex: 1;
  }
  .header-title span {
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    font-weight: 400;
    color: rgba(255,255,255,0.7);
    display: block;
    margin-top: 2px;
  }
  .progress-bar-wrap {
    flex: 2;
    min-width: 200px;
  }
  .progress-label {
    font-size: 0.7rem;
    color: rgba(255,255,255,0.8);
    margin-bottom: 4px;
    font-weight: 500;
  }
  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: white;
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .stats {
    display: flex;
    gap: 16px;
    color: white;
    font-size: 0.8rem;
  }
  .stat { text-align: center; }
  .stat strong { display: block; font-size: 1.1rem; font-family: 'DM Mono', monospace; }

  /* ── LAYOUT ── */
  .layout {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 32px;
    align-items: start;
  }

  /* ── SIDEBAR ── */
  .sidebar {
    position: sticky;
    top: 80px;
  }
  .sidebar-title {
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
    padding-left: 4px;
  }
  .subject-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 10px;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
    margin-bottom: 4px;
    transition: all 0.18s ease;
    font-family: 'DM Sans', sans-serif;
  }
  .subject-btn:hover { background: rgba(0,0,0,0.05); }
  .subject-btn.active { color: white; }
  .subject-icon {
    width: 28px;
    height: 28px;
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #subject-nav {
    max-height: calc(100vh - 320px);
    overflow-y: auto;
    padding-right: 4px;
  }
  #subject-nav::-webkit-scrollbar {
    width: 8px;
  }
  #subject-nav::-webkit-scrollbar-thumb {
    background: rgba(0,0,0,0.18);
    border-radius: 999px;
  }
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
  }
  .subject-label {
    font-size: 0.82rem;
    font-weight: 500;
    line-height: 1.2;
    flex: 1;
  }
  .subject-count {
    font-size: 0.7rem;
    font-family: 'DM Mono', monospace;
    opacity: 0.6;
    background: rgba(0,0,0,0.07);
    border-radius: 99px;
    padding: 2px 7px;
  }
  .subject-btn.active .subject-count {
    background: rgba(255,255,255,0.2);
    opacity: 1;
  }

  .sidebar-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 14px 0;
  }
  .filter-row {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 5px 12px;
    border-radius: 99px;
    border: 1.5px solid var(--border);
    background: white;
    font-size: 0.72rem;
    font-weight: 500;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
    color: var(--text-muted);
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--red);
    color: var(--red);
    background: var(--red-light);
  }

  .revisado-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .revisado-btn:hover {
    background: rgba(255,255,255,0.3);
  }

  /* ── MAIN ── */
  .main-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 24px;
  }
  .main-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text);
  }
  .main-header .subject-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-bottom: 2px;
  }
  .cards-count {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-left: auto;
  }

  /* ── CARDS GRID ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  /* ── FLASHCARD ── */
  .flashcard {
    perspective: 1000px;
    height: 240px;
    cursor: pointer;
  }
  .flashcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }
  .flashcard.flipped .flashcard-inner {
    transform: rotateY(180deg);
  }
  .flashcard-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s;
    overflow: hidden;
  }
  .flashcard:hover .flashcard-face {
    box-shadow: var(--shadow-hover);
  }
  .flashcard-front {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
  }
  .flashcard-back {
    transform: rotateY(180deg);
    border: 1.5px solid transparent;
  }

  /* Front layout */
  .card-top-bar {
    height: 5px;
    border-radius: 16px 16px 0 0;
    flex-shrink: 0;
  }
  .card-body {
    flex: 1;
    padding: 20px 22px 14px;
    display: flex;
    flex-direction: column;
  }
  .card-tag {
    font-size: 0.6rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }
  .card-question {
    font-size: 0.92rem;
    font-weight: 500;
    line-height: 1.55;
    color: var(--text);
    flex: 1;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 22px;
    border-top: 1px solid var(--border);
  }
  .card-hint {
    font-size: 0.68rem;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .flip-icon {
    font-size: 0.75rem;
    color: var(--text-muted);
    transition: transform 0.3s;
  }
  .flashcard:hover .flip-icon { transform: rotate(180deg); }

  /* Status dots */
  .status-dots {
    display: flex;
    gap: 5px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }
  .status-dot.green { background: #27AE60; border-color: #27AE60; }
  .status-dot.yellow { background: #F39C12; border-color: #F39C12; }
  .status-dot.red-dot { background: #E74C3C; border-color: #E74C3C; }

  /* Back layout */
  .card-answer {
    flex: 1;
    padding: 20px 22px 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .answer-label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 10px;
    color: white;
    opacity: 0.8;
  }
  .answer-text {
    font-size: 0.85rem;
    line-height: 1.6;
    color: white;
    overflow-y: auto;
    flex: 1;
    padding-right: 4px;
  }
  .answer-text::-webkit-scrollbar { width: 3px; }
  .answer-text::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 99px; }
  .card-back-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 22px;
    border-top: 1px solid rgba(255,255,255,0.2);
  }
  .self-rating {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .rating-label {
    font-size: 0.65rem;
    color: rgba(255,255,255,0.7);
    margin-right: 4px;
  }
  .rating-btn {
    padding: 4px 10px;
    border-radius: 99px;
    border: 1.5px solid rgba(255,255,255,0.3);
    background: transparent;
    color: rgba(255,255,255,0.8);
    font-size: 0.68rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.15s;
  }
  .rating-btn:hover { background: rgba(255,255,255,0.15); }
  .rating-btn.r-easy { border-color: #27AE60; color: #A9DFBF; }
  .rating-btn.r-easy:hover { background: rgba(39,174,96,0.25); }
  .rating-btn.r-hard { border-color: #E74C3C; color: #F1948A; }
  .rating-btn.r-hard:hover { background: rgba(231,76,60,0.25); }

  /* ── SECTION HEADER ── */
  .section-break {
    grid-column: 1 / -1;
    margin-top: 8px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-break-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .section-break-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── EMPTY STATE ── */
  .empty-state {
    grid-column: 1 / -1;
    text-align: center;
    padding: 80px 20px;
    color: var(--text-muted);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
  .empty-state p { font-size: 0.9rem; }

  /* ── FORMULA CARD ── */
  .formula-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .formula-card .card-top-bar { height: 4px; }
  .formula-inner { padding: 18px 20px; }
  .formula-name {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .formula-eq {
    font-family: 'DM Mono', monospace;
    font-size: 1rem;
    font-weight: 500;
    color: var(--text);
    background: var(--bg);
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    line-height: 1.5;
  }
  .formula-desc {
    font-size: 0.78rem;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* MOBILE */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    .sidebar { position: static; }
    .cards-grid { grid-template-columns: 1fr; }
    .header-inner { padding: 12px 16px; }
    .progress-bar-wrap, .stats { display: none; }
  }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .flashcard {
    animation: fadeUp 0.3s ease both;
  }
  .flashcard:nth-child(1) { animation-delay: 0.03s; }
  .flashcard:nth-child(2) { animation-delay: 0.06s; }
  .flashcard:nth-child(3) { animation-delay: 0.09s; }
  .flashcard:nth-child(4) { animation-delay: 0.12s; }
  .flashcard:nth-child(5) { animation-delay: 0.15s; }
  .flashcard:nth-child(6) { animation-delay: 0.18s; }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: white;
    padding: 10px 20px;
    border-radius: 10px;
    font-size: 0.82rem;
    font-weight: 500;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s ease;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<div id="login-screen" style="position:fixed;z-index:9999;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);">
  <form id="login-form" style="background:white;padding:36px 32px 28px 32px;border-radius:16px;box-shadow:0 4px 32px rgba(0,0,0,0.10);display:flex;flex-direction:column;gap:18px;min-width:320px;">
    <div style="font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--red);text-align:center;">Fichas de Estudo</div>
    <div style="color:var(--text-muted);font-size:0.95rem;text-align:center;">Acesso restrito. Digite a senha para entrar:</div>
    <input id="senha-input" type="password" placeholder="Senha" autocomplete="current-password" style="padding:10px 12px;font-size:1.1rem;border-radius:8px;border:1.5px solid var(--border);outline:none;" required />
    <button type="submit" style="background:var(--red);color:white;font-weight:600;font-size:1.1rem;padding:10px 0;border:none;border-radius:8px;cursor:pointer;">Entrar</button>
    <div id="senha-erro" style="color:var(--red);font-size:0.95rem;display:none;text-align:center;">Senha incorreta</div>
  </form>
</div>

<div id="conteudo-app" style="display:none;">
  <header>
    <div class="header-inner">
      <div class="header-title">
        Fichas de Estudo
        <span>São Camilo — Medicina 2026</span>
      </div>
      <div class="progress-bar-wrap">
        <div class="progress-label" id="prog-label">0 fichas revisadas</div>
        <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      </div>
      <div class="stats">
        <div class="stat"><strong id="stat-total">0</strong>total</div>
        <div class="stat"><strong id="stat-ok">0</strong>✓ sei</div>
        <div class="stat"><strong id="stat-rev">0</strong>↻ revisar</div>
      </div>
    </div>
  </header>

  <div class="layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
        <span>Disciplinas</span>
        <button id="add-disciplina-btn" title="Adicionar disciplina" style="background:var(--green);color:white;border:none;border-radius:6px;padding:2px 10px;font-size:1.1em;cursor:pointer;">+</button>
      </div>
      <div id="add-disciplina-form-wrap" style="display:none;margin:10px 0 0 0;">
        <form id="add-disciplina-form" style="display:flex;gap:8px;align-items:center;">
          <input id="add-disciplina-nome" type="text" placeholder="Nome da disciplina" required maxlength="32" style="padding:4px 8px;border-radius:6px;border:1.2px solid var(--border);font-size:1em;" />
          <input id="add-disciplina-icone" type="text" placeholder="Ícone" maxlength="2" style="width:2.5em;padding:4px 6px;border-radius:6px;border:1.2px solid var(--border);font-size:1em;" />
          <button type="submit" style="background:var(--green);color:white;border:none;border-radius:6px;padding:4px 12px;font-size:1em;cursor:pointer;">Salvar</button>
          <button type="button" id="cancelar-add-disciplina" style="background:var(--red);color:white;border:none;border-radius:6px;padding:4px 12px;font-size:1em;cursor:pointer;">Cancelar</button>
        </form>
      </div>
      <div id="subject-nav"></div>
      <div class="sidebar-title" style="margin-top:18px;">Disciplinas finalizadas</div>
      <ul id="finalizadas-list" style="font-size:0.93em;color:var(--green);margin:0 0 10px 0;padding-left:18px;min-height:18px;"></ul>
      <hr class="sidebar-divider"></hr>
      <div class="sidebar-title">Filtrar</div>
      <div class="filter-row">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="unseen">Novas</button>
        <button class="filter-btn" data-filter="review">Revisar</button>
        <button class="filter-btn" data-filter="revisado">Revisado</button>
        <button class="filter-btn" data-filter="known">Sei ✓</button>
        <button class="filter-btn" data-filter="dificil">Difíceis ✗</button>
      </div>
      <div class="sidebar-title" style="margin-top:18px;">Apagadas</div>
      <ul id="deleted-list" style="font-size:0.93em;color:var(--text);margin:0 0 10px 0;padding-left:18px;min-height:18px;"></ul>
    </aside>

    <!-- MAIN -->
    <main>
      <div class="main-header">
        <div class="subject-dot" id="active-dot"></div>
        <h2 id="active-title">Todas as Fichas</h2>
        <span class="cards-count" id="active-count"></span>
        <button id="nova-ficha-btn" style="margin-left:24px;padding:7px 18px;font-size:1rem;border-radius:8px;background:var(--green);color:white;border:none;cursor:pointer;font-weight:600;">+ Nova Ficha</button>
      </div>
      <div id="nova-ficha-form-wrap" style="display:none;margin-bottom:18px;">
        <form id="nova-ficha-form" style="background:var(--card-bg);border:1.5px solid var(--border);border-radius:12px;padding:18px 18px 10px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;">
          <div style="flex:1 1 180px;min-width:160px;">
            <label style="font-size:0.9em;color:var(--text-muted);">Disciplina</label><br>
            <select id="nova-ficha-subj" required style="width:100%;padding:6px 8px;border-radius:7px;border:1.2px solid var(--border);font-size:1em;">
              <option value="">Selecione</option>
            </select>
          </div>
          <div style="flex:1 1 120px;min-width:100px;">
            <label style="font-size:0.9em;color:var(--text-muted);">Tag</label><br>
            <input id="nova-ficha-tag" type="text" required maxlength="40" style="width:100%;padding:6px 8px;border-radius:7px;border:1.2px solid var(--border);font-size:1em;" />
          </div>
          <div style="flex:2 1 220px;min-width:180px;">
            <label style="font-size:0.9em;color:var(--text-muted);">Pergunta</label><br>
            <input id="nova-ficha-q" type="text" required maxlength="200" style="width:100%;padding:6px 8px;border-radius:7px;border:1.2px solid var(--border);font-size:1em;" />
          </div>
          <div style="flex:2 1 220px;min-width:180px;">
            <label style="font-size:0.9em;color:var(--text-muted);">Resposta</label><br>
            <input id="nova-ficha-a" type="text" required maxlength="400" style="width:100%;padding:6px 8px;border-radius:7px;border:1.2px solid var(--border);font-size:1em;" />
          </div>
          <button type="submit" style="background:var(--green);color:white;font-weight:600;font-size:1em;padding:8px 18px;border:none;border-radius:8px;cursor:pointer;">Salvar</button>
          <button type="button" id="cancelar-nova-ficha" style="background:var(--red);color:white;font-weight:600;font-size:1em;padding:8px 18px;border:none;border-radius:8px;cursor:pointer;">Cancelar</button>
        </form>
      </div>
      <div class="cards-grid" id="cards-grid"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ========== DISCIPLINAS FINALIZADAS ==========
function renderDisciplinasFinalizadas() {
  const ul = document.getElementById('finalizadas-list');
  if (!ul) return;
  ul.innerHTML = '';
  const finalizadas = SUBJECTS.filter(s => {
    if (state.subjectFinalized.includes(s.id)) return true;
    const fichas = CARDS.filter(c => c.subj === s.id);
    if (fichas.length === 0) return false;
    return fichas.every(c => {
      const st = state.cardStatus[c.id];
      if (!st) return false;
      if (typeof st === 'string') return st === 'known';
      return st.status === 'known';
    });
  });
  if (finalizadas.length === 0) {
    const li = document.createElement('li');
    li.textContent = 'Nenhuma disciplina finalizada.';
    li.style.opacity = '0.6';
    ul.appendChild(li);
    return;
  }
  finalizadas.forEach(s => {
    const li = document.createElement('li');
    li.textContent = s.label;
    ul.appendChild(li);
  });
}

function renderDeletedSubjects() {
  const ul = document.getElementById('deleted-list');
  if (!ul) return;
  ul.innerHTML = '';
  if (state.deletedSubjects.length === 0) {
    const li = document.createElement('li');
    li.textContent = 'Nenhuma disciplina apagada.';
    li.style.opacity = '0.6';
    ul.appendChild(li);
    return;
  }
  state.deletedSubjects.forEach(item => {
    const li = document.createElement('li');
    li.style.display = 'flex';
    li.style.justifyContent = 'space-between';
    li.style.alignItems = 'center';
    li.style.marginBottom = '4px';
    const name = document.createElement('span');
    name.textContent = item.subject.label;
    const btn = document.createElement('button');
    btn.textContent = 'Restaurar';
    btn.style.background = 'var(--green)';
    btn.style.color = 'white';
    btn.style.border = 'none';
    btn.style.borderRadius = '6px';
    btn.style.padding = '4px 8px';
    btn.style.cursor = 'pointer';
    btn.addEventListener('click', () => restoreDisciplina(item.subject.id));
    li.appendChild(name);
    li.appendChild(btn);
    ul.appendChild(li);
  });
}
// ========== NOVA FICHA ==========
function renderNovaFichaSubjects() {
  const sel = document.getElementById('nova-ficha-subj');
  if (!sel) return;
  sel.innerHTML = '<option value="">Selecione</option>';
  SUBJECTS.forEach(s => {
    sel.innerHTML += `<option value="${s.id}">${s.label}</option>`;
  });
}

function gerarIdFichaNova() {
  // Gera id único baseado no timestamp
  return 'n' + Date.now();
}

function setupNovaFicha() {
  const btn = document.getElementById('nova-ficha-btn');
  const formWrap = document.getElementById('nova-ficha-form-wrap');
  const form = document.getElementById('nova-ficha-form');
  const cancelar = document.getElementById('cancelar-nova-ficha');
  if (!btn || !formWrap || !form) return;
  btn.onclick = () => {
    renderNovaFichaSubjects();
    form.reset();
    formWrap.style.display = '';
    btn.style.display = 'none';
  };
  cancelar.onclick = () => {
    formWrap.style.display = 'none';
    btn.style.display = '';
  };
  form.onsubmit = (e) => {
    e.preventDefault();
    const subj = document.getElementById('nova-ficha-subj').value;
    const tag = document.getElementById('nova-ficha-tag').value.trim();
    const q = document.getElementById('nova-ficha-q').value.trim();
    const a = document.getElementById('nova-ficha-a').value.trim();
    if (!subj || !tag || !q || !a) return;
    const id = gerarIdFichaNova();
    CARDS.push({ id, subj, tag, q, a });
    saveStatus();
    formWrap.style.display = 'none';
    btn.style.display = '';
    renderCards();
    showToast('Ficha criada!');
  };
}

function setupDisciplinaAddRemove() {
  const btn = document.getElementById('add-disciplina-btn');
  const formWrap = document.getElementById('add-disciplina-form-wrap');
  const form = document.getElementById('add-disciplina-form');
  const cancelar = document.getElementById('cancelar-add-disciplina');
  if (!btn || !formWrap || !form || !cancelar) return;

  btn.onclick = () => {
    form.reset();
    formWrap.style.display = '';
    btn.style.display = 'none';
  };

  cancelar.onclick = () => {
    formWrap.style.display = 'none';
    btn.style.display = '';
  };

  form.onsubmit = (e) => {
    e.preventDefault();
    const nome = document.getElementById('add-disciplina-nome').value.trim();
    const icone = document.getElementById('add-disciplina-icone').value.trim() || '📚';
    if (!nome) return;
    let id = nome.toLowerCase().replace(/[^a-z0-9]/gi, '');
    if (!id) id = 'd' + Date.now();
    if (SUBJECTS.some(s => s.id === id)) {
      id = `${id}${Date.now()}`;
    }
    const cor = '#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0');
    const light = '#F5F5F5';
    SUBJECTS.push({ id, label: nome, icon: icone, color: cor, light });
    formWrap.style.display = 'none';
    btn.style.display = '';
    buildNav();
    renderNovaFichaSubjects();
    showToast('Disciplina adicionada!');
  };
}

function removerDisciplina(id) {
  const idx = SUBJECTS.findIndex(s => s.id === id);
  if (idx === -1) return;
  const subject = SUBJECTS[idx];
  const cards = CARDS.filter(c => c.subj === id);
  const statuses = cards.map(c => ({ id: c.id, status: state.cardStatus[c.id] }));
  state.deletedSubjects.push({ subject, cards, statuses });
  SUBJECTS.splice(idx, 1);
  for (let i = CARDS.length - 1; i >= 0; i--) {
    if (CARDS[i].subj === id) {
      const removedId = CARDS[i].id;
      CARDS.splice(i, 1);
      delete state.cardStatus[removedId];
    }
  }
  state.subjectFinalized = state.subjectFinalized.filter(sid => sid !== id);
  if (state.activeSubject === id) {
    state.activeSubject = 'all';
  }
  saveStatus();
  saveDeletedSubjects();
  saveSubjectFinalized();
  buildNav();
  renderCards();
  renderNovaFichaSubjects();
  showToast('Disciplina removida!');
}

    q:"Como calcular a FÓRMULA MOLECULAR de um composto desconhecido por estequiometria?",
    a:"Equação: A + X → B + subproduto. Subtrair os átomos de cada elemento: C: B_c – A_c; H: B_h – A_h; O: B_o – A_o. Ex: C₁₆H₁₄O₃ + X → C₂₃H₁₈O₅ + H₂O. X: C=23-16=7; H=(18+2)-14=6; O=(5+1)-3=3. X = C₇H₆O₃. Sempre incluir o subproduto (H₂O na esterificação) nos cálculos." },
  { id:"q7", subj:"quim", tag:"Concentração de Soluções",
    q:"Fórmula de concentração e conversão de unidades: como calcular massa a partir de gotas?",
    a:"C = m/V (g/L). Para calcular massa: m = C × V. Converter gotas → mL: número de gotas × volume por gota. mL → L: dividir por 1000. Ex: 300 gotas × 0,05 mL/gota = 15 mL = 0,015 L. m = 20 g/L × 0,015 L = 0,3 g = 300 mg. Atenção: resultado deve ser em mg (unidade pedida)." },
  { id:"q8", subj:"quim", tag:"Solubilidade",
    q:"O que é COEFICIENTE DE SOLUBILIDADE? Como identificar solução saturada vs insaturada?",
    a:"Coeficiente = gramas de soluto por 100g de H₂O (a temperatura fixa). Insaturada: massa < coeficiente (dissolve tudo, solução clara). Saturada: massa = coeficiente. Supersaturada: massa > coeficiente → precipita (corpo de fundo). Para comparar com 50g H₂O: coeficiente/2 = limite em 50g." },
  { id:"q9", subj:"quim", tag:"Estados Físicos",
    q:"Como determinar o estado físico de uma substância pura a uma dada temperatura?",
    a:"Comparar a temperatura do problema com os pontos de fusão e ebulição: T < Tf → sólido. Tf < T < Te → líquido. T > Te → gasoso. Ex: composto com Tf=64°C. A 25°C (< 64°C) → estado SÓLIDO. A 80°C (> 64°C, < Te) → líquido. Sempre a 1 atm (pressão padrão) salvo indicação contrária." },
  { id:"q10", subj:"quim", tag:"Ciclos Biogeoquímicos",
    q:"Quais compostos de enxofre são relevantes em química ambiental?",
    a:"H₂S (sulfeto de hidrogênio): gás, odor de ovo podre, produzido em decomposição anaeróbia. SO₂ (dióxido de enxofre): poluente, causa chuva ácida (→ H₂SO₃/H₂SO₄). SO₄²⁻ (sulfato): forma oxidada, absorvida por plantas. Na indústria: H₂SO₄ (ácido sulfúrico) é o produto químico mais produzido do mundo." },

  // ── FÍSICA ──
  { id:"f1", subj:"fis", tag:"Hidrostática",
    q:"O que determina o EMPUXO? Por que ele é constante quando o objeto está totalmente imerso?",
    a:"Empuxo = d_fluido × V_imerso × g (Princípio de Arquimedes). Quando TOTALMENTE imerso, V_imerso = volume do objeto = constante. Não importa a profundidade — o volume não muda. Logo, E = constante. PRESSÃO hidrostatica P = P₀ + dgh AUMENTA com profundidade. Empuxo ≠ Pressão." },
  { id:"f2", subj:"fis", tag:"Hidrostática",
    q:"Qual é a condição de MOVIMENTO UNIFORME em um fluido? Como as forças se equilibram?",
    a:"Movimento uniforme = velocidade constante = aceleração zero = resultante zero. Para esfera afundando em MU: Peso = Empuxo + Força de Arrasto (atrito do fluido). Se Peso > Empuxo: afunda. Se Peso = Empuxo: flutua. Se Peso < Empuxo: sobe. O MU indica que as forças estão equilibradas durante o movimento." },
  { id:"f3", subj:"fis", tag:"Calorimetria",
    q:"Fórmula do calor sensível e como calcular experimentalmente o ponto de ebulição?",
    a:"Q = m × c × ΔT. Para água: c = 1 cal/(g·°C). Ex: 650g de água de 20°C → Q = 650 × 1 × (T_eb – 20). Se no gráfico Q = 39.000 cal no joelho da curva: 650 × (T_eb – 20) = 39.000 → T_eb ≈ 80°C. Ponto de ebulição diminui com altitude/pressão (Alta altitude → menor pressão → menos energia para evaporar)." },
  { id:"f4", subj:"fis", tag:"Ótica Geométrica",
    q:"Equação de Gauss e ampliação linear para lentes convergentes.",
    a:"1/f = 1/p + 1/p' (equação de Gauss/conjugada). Ampliação: M = –p'/p = i/o (i = tamanho da imagem, o = tamanho do objeto). Imagem real: p' > 0, formada do lado oposto ao objeto. Imagem virtual: p' < 0. Para objeto além de 2f: imagem real, invertida, reduzida. Ponto focal: objeto em f → imagem no infinito." },
  { id:"f5", subj:"fis", tag:"Ótica Geométrica",
    q:"Como resolver problemas de lente com objeto e imagem de tamanhos diferentes?",
    a:"1. Calcule M = i/o = tamanho_imagem / tamanho_objeto. 2. Use M = p'/p → p' = M × p. 3. Aplique equação de Gauss: 1/f = 1/p + 1/p'. Ex: imagem=12cm, objeto=80cm → M = 12/80 = 0,15. p'=30cm → p = p'/M = 30/0,15 = 200cm = 2m. Sinal negativo indica inversão (ignore para magnitude)." },
  { id:"f6", subj:"fis", tag:"Ondulatória",
    q:"Relação entre velocidade, frequência e comprimento de onda.",
    a:"v = λ × f (velocidade = comprimento de onda × frequência). λ = v/f. f = v/λ. Período T = 1/f. Para encontrar v de um gráfico: v = Δx/Δt (deslocamento da onda no tempo). Ex: onda avança 60cm em 2s → v = 30 cm/s. Com f = 1/6 Hz: λ = 30 / (1/6) = 30 × 6 = 180 cm." },
  { id:"f7", subj:"fis", tag:"Eletricidade",
    q:"Como calcular resistência equivalente de resistores em série e em paralelo?",
    a:"Série: R_eq = R₁ + R₂ + R₃ (corrente igual em todos). Paralelo: 1/R_eq = 1/R₁ + 1/R₂ (tensão igual em todos). Para 2 resistores em paralelo: R_eq = (R₁×R₂)/(R₁+R₂). Corrente total: I = V/R_eq. Tensão em cada resistor (série): V_R = I × R. Potência: P = V×I = I²×R = V²/R." },
  { id:"f8", subj:"fis", tag:"Mecânica",
    q:"Como aplicar a 2ª Lei de Newton em sistemas com múltiplos blocos e polias?",
    a:"1. Desenhe as forças em cada bloco. 2. Escreva F=ma para cada. 3. Some as equações para eliminar tensões internas. 4. R_total = (mA – mB)g – Fat = (mA + mB + mC) × a. Para atrito: Fat = μ × N (N = peso do bloco na superfície horizontal). Blocos em MU: a = 0, soma de forças = 0." },
  { id:"f9", subj:"fis", tag:"Mecânica",
    q:"Como calcular a força de atrito? Diferença entre atrito estático e cinético.",
    a:"Fat = μ × N (N = força normal). Atrito estático (μe): impede o movimento, máximo antes de deslizar. Atrito cinético (μc): durante o deslizamento, μc < μe. N em superfície horizontal = Peso do objeto. N em plano inclinado = mg cosθ. No problema: μ = 0,5, mC = 2kg → Fat = 0,5 × 2 × 10 = 10N." },

  // ── MATEMÁTICA ──
  { id:"m1", subj:"mat", tag:"Função Quadrática",
    q:"Como resolver problemas com função quadrática Q(t) = –t² – bt + k?",
    a:"1. Identificar k (valor inicial, t=0). 2. Substituir t pelo valor pedido. 3. Calcular. Ex: k = 5mL × 10mg/mL = 50mg. Q(t) = –t² – 5t + 50. Q(4) = –16 – 20 + 50 = 14mg. Vértice: t = –b/2a = –(–5)/(2×–1) = –2,5 (máximo se a<0). Zeros: fórmula de Bhaskara." },
  { id:"m2", subj:"mat", tag:"Logaritmos",
    q:"Propriedades dos logaritmos que mais caem no vestibular.",
    a:"log(a×b) = log a + log b. log(a/b) = log a – log b. log(aⁿ) = n × log a. log_b(b) = 1. log_b(1) = 0. log 2 ≈ 0,30; log 3 ≈ 0,48; log 5 = log(10/2) = 1 – 0,30 = 0,70. Para achar raiz de f(x) = log(x+m): faça log(x+m) = 0 → x+m = 1 → x = 1–m." },
  { id:"m3", subj:"mat", tag:"Análise Combinatória",
    q:"Princípio Fundamental da Contagem: quando usar e como aplicar?",
    a:"Se um evento tem m formas e outro tem n formas, juntos têm m × n formas. Aplicar quando as escolhas são independentes. Ex: 2 tipos de papel × 5 cores = 10 opções. Cuidado: restrições podem reduzir. 'A parede da TV deve ser DIFERENTE das outras' = subtrair as opções iguais. Permutação P(n) = n!. Combinação C(n,k) = n!/k!(n-k)!." },
  { id:"m4", subj:"mat", tag:"Geometria Plana",
    q:"Como calcular elementos de um TRAPÉZIO (altura, diagonais, diferença de bases)?",
    a:"Trapézio ABCD: bases paralelas AD e BC. Altura h: perpendicular entre as bases. Abaixar perpendiculares dos extremos da base menor: AD = BC + AF + DE. AF e DE são os catetos dos triângulos laterais. Usar Pitágoras: AB² = h² + AF² e CD² = h² + DE². AD – BC = AF + DE. Resolver sistema para achar h, AF, DE." },
  { id:"m5", subj:"mat", tag:"Função Logarítmica",
    q:"Como encontrar interseção e raiz de f(x) = log(x+m) com g(x) = –x–4?",
    a:"Raiz de g: g(x)=0 → –x–4=0 → x=–4. Se P é raiz de ambas e interseção: f(–4)=0 → log(–4+m)=0 → –4+m=1 → m=5. Q = interseção de f com eixo y: f(0) = log(0+5) = log5 = 1–log2 ≈ 0,70. R = interseção de g com eixo y: g(0) = –4. Área do triângulo = ½ × base × altura." },
  { id:"m6", subj:"mat", tag:"Proporcionalidade",
    q:"Como calcular ECONOMIA DE ENERGIA em porcentagem?",
    a:"1. Calcular massa total: n_unidades × massa_unitária → converter para toneladas. 2. Calcular energia de produção primária: massa(ton) × energia(kWh/ton). 3. Aplicar % de economia: E_economizada = E_primária × (% / 100). Ex: 20.000 × 15g = 300.000g = 0,3 ton. 0,3 × 15.000 = 4.500 kWh × 0,95 = 4.275 kWh." },

  // ── HISTÓRIA ──
  { id:"h1", subj:"hist", tag:"Revolução Inglesa",
    q:"O que foi a Revolução Inglesa e qual foi o papel de Oliver Cromwell?",
    a:"Século XVII: conflito entre rei Carlos I (absolutismo/direito divino) e Parlamento (burguesia). Cromwell lidera exército parlamentarista, executa Carlos I (1649). Cromwell = Lorde Protetor (ditadura militar-puritana). Defende burguesia e comerciantes. Após sua morte, Carlos II restaura a monarquia (1660) — mas agora a serviço da burguesia." },
  { id:"h2", subj:"hist", tag:"Teorias Econômicas",
    q:"Compare Adam Smith, Karl Marx, Joseph Schumpeter e John Maynard Keynes.",

  { id:"h3", subj:"hist", tag:"Brasil República",

  { id:"h4", subj:"hist", tag:"Brasil República",

  { id:"h5", subj:"hist", tag:"História Antiga",
    q:"Quais eram as funções do sistema de numeração romano?",
    a:"Representar quantidades para registros oficiais, comerciais e administrativos. NÃO permitia operações aritméticas (sem zero, sem notação posicional). Usado até hoje: séculos (XXI), papas e reis (João XXIII), capítulos de livros, relógios antigos. O sistema indiano-arábico (com zero) substituiu para cálculos matemáticos." },

  // ── GEOGRAFIA ──
  { id:"g1", subj:"geo", tag:"Geomorfologia",
    q:"Diferença entre EROSÃO e INTEMPERISMO como agentes modeladores do relevo.",
    a:"Intemperismo: desagregação/alteração da rocha no local (sem transporte). Físico: variação de temperatura (dilata/contrai). Químico: reação com água, O₂, CO₂ (dissolução). Biológico: raízes, líquens. Erosão: remoção e TRANSPORTE de material. Agentes: água (erosão fluvial/pluvial), vento (eólica), gelo (glacial), ondas (marinha)." },
  { id:"g2", subj:"geo", tag:"Cartografia",
    q:"Como calcular horários em diferentes fusos? Qual é a regra para leste e oeste?",
    a:"Cada fuso = 15° de longitude = 1 hora de diferença. Para LESTE (GMT maior): SOMA horas. Para OESTE (GMT menor): SUBTRAI horas. Ex: Nova Jersey GMT–4, 15h. Brasília GMT–3: 15h + 1h = 16h. Londres GMT+1: 15h + 5h = 20h. Paris GMT+2: 15h + 6h = 21h. Diferença = GMT_destino – GMT_origem." },
  { id:"g3", subj:"geo", tag:"Astronomia",
    q:"Quais são os solstícios e equinócios no HEMISFÉRIO SUL?",
    a:"Equinócio de OUTONO (HS): ~21/03. Equinócio de PRIMAVERA (HS): ~23/09. Solstício de INVERNO (HS): ~21/06 = dia mais curto, Sol sobre Trópico de Câncer. Solstício de VERÃO (HS): ~21/12 = dia mais longo, Sol sobre Trópico de Capricórnio. Em EQUINÓCIOS: Sol perpendicular ao Equador, dia = noite em todo planeta." },

  { id:"g5", subj:"geo", tag:"Geopolítica",

    a:"Sahel: faixa semiárida no N da África (Mali, Niger, Burkina Faso). Crise: jihadistas, juntas militares após golpes, mudanças climáticas, seca. Ouro: principal recurso econômico das juntas militares. Financia grupos armados, intensifica conflitos. Isolamento regional: saída da CEDEAO (organização regional). Consequência: instabilidade crônica." },

    a:"Multilateralismo: tomada de decisões com múltiplos atores internacionais em condições de relativa igualdade. Baseado em organizações internacionais (ONU, OMC, FMI). Unilateralismo: um país toma decisões sozinho (ex: tarifas unilaterais de Trump). BRICS defende multilateralismo como forma de equilibrar o poder dos EUA/Europa." },
];

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
const state = {
  activeSubject: 'all',
  activeFilter: 'all',
  cardStatus: JSON.parse(localStorage.getItem('cardStatus') || '{}'),
  subjectFinalized: JSON.parse(localStorage.getItem('subjectFinalized') || '[]'),
  deletedSubjects: JSON.parse(localStorage.getItem('deletedSubjects') || '[]'),
};

function saveStatus() {
  localStorage.setItem('cardStatus', JSON.stringify(state.cardStatus));
}

function saveSubjectFinalized() {
  localStorage.setItem('subjectFinalized', JSON.stringify(state.subjectFinalized));
}

function saveDeletedSubjects() {
  localStorage.setItem('deletedSubjects', JSON.stringify(state.deletedSubjects));
}

// ══════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════
function getSubjectData(id) {
  return SUBJECTS.find(s => s.id === id) || { color: '#888', light: '#eee', icon: '?' };
}

function buildNav() {
  const nav = document.getElementById('subject-nav');
  nav.innerHTML = '';
  const allBtn = createSubjBtn('all', '📚', 'Todas as Fichas', CARDS.length, '#2C3E50', '#F5F5F5');
  nav.appendChild(allBtn);

  SUBJECTS.forEach(s => {
    const count = CARDS.filter(c => c.subj === s.id).length;
    nav.appendChild(createSubjBtn(s.id, s.icon, s.label, count, s.color, s.light));
  });
  // Atualiza disciplinas finalizadas e apagadas sempre que navega
  renderDisciplinasFinalizadas();
  renderDeletedSubjects();
}

function createSubjBtn(id, icon, label, count, color, light) {
  const wrap = document.createElement('div');
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.gap = '6px';

  const btn = document.createElement('button');
  btn.className = 'subject-btn' + (state.activeSubject === id ? ' active' : '');
  btn.dataset.id = id;
  btn.style.cssText = state.activeSubject === id
    ? `background: ${color}; color: white;`
    : '';
  btn.innerHTML = `
    <div class="subject-icon" style="background:${state.activeSubject === id ? 'rgba(255,255,255,0.2)' : light}">${icon}</div>
    <span class="subject-label">${label}</span>
    <span class="subject-count">${count}</span>
  `;
  btn.addEventListener('click', () => {
    state.activeSubject = id;
    refreshNav();
    renderCards();
  });
  wrap.appendChild(btn);

  if (id !== 'all') {
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = state.subjectFinalized.includes(id);
    checkbox.title = 'Marcar como finalizada';
    checkbox.style.width = '16px';
    checkbox.style.height = '16px';
    checkbox.style.cursor = 'pointer';
    checkbox.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleSubjectFinalizada(id);
    });
    wrap.appendChild(checkbox);

    const del = document.createElement('button');
    del.textContent = '🗑️';
    del.title = 'Remover disciplina';
    del.style.cssText = 'background:none;border:none;color:#c0392b;font-size:1.1em;cursor:pointer;padding:0 4px;';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (confirm('Remover disciplina e todas as fichas?')) removerDisciplina(id);
    });
    wrap.appendChild(del);
  }

  return wrap;
}

function refreshNav() {
  const nav = document.getElementById('subject-nav');
  nav.innerHTML = '';
  buildNav();
}

function toggleSubjectFinalizada(id) {
  const index = state.subjectFinalized.indexOf(id);
  if (index === -1) {
    state.subjectFinalized.push(id);
  } else {
    state.subjectFinalized.splice(index, 1);
  }
  saveSubjectFinalized();
  renderDisciplinasFinalizadas();
}

function restoreDisciplina(id) {
  const itemIndex = state.deletedSubjects.findIndex(item => item.subject.id === id);
  if (itemIndex === -1) return;
  const item = state.deletedSubjects[itemIndex];
  SUBJECTS.push(item.subject);
  item.cards.forEach(card => CARDS.push(card));
  if (item.statuses) {
    item.statuses.forEach(entry => {
      if (entry && entry.id) state.cardStatus[entry.id] = entry.status;
    });
  }
  state.deletedSubjects.splice(itemIndex, 1);
  saveDeletedSubjects();
  saveStatus();
  buildNav();
  renderNovaFichaSubjects();
  renderCards();
  showToast('Disciplina restaurada!');
}

function buildFilters() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    });
  });
}

function getFilteredCards() {
  let cards = CARDS;
  if (state.activeSubject !== 'all') {
    cards = cards.filter(c => c.subj === state.activeSubject);
  }
  if (state.activeFilter === 'unseen') {
    cards = cards.filter(c => {
      const st = state.cardStatus[c.id];
      if (!st) return true;
      if (typeof st === 'string') return false;
      return !st.status;
    });
  } else if (state.activeFilter === 'review') {
    cards = cards.filter(c => {
      const st = state.cardStatus[c.id];
      if (!st) return false;
      if (typeof st === 'string') return st === 'review';
      return st.status === 'review';
    });
  } else if (state.activeFilter === 'revisado') {
    cards = cards.filter(c => {
      const st = state.cardStatus[c.id];
      if (!st) return false;
      if (typeof st === 'string') return false;
      return st.status === 'revisado';
    });
  } else if (state.activeFilter === 'known') {
    cards = cards.filter(c => {
      const st = state.cardStatus[c.id];
      if (!st) return false;
      if (typeof st === 'string') return st === 'known';
      return st.status === 'known';
    });
  } else if (state.activeFilter === 'dificil') {
    cards = cards.filter(c => {
      const st = state.cardStatus[c.id];
      if (!st) return false;
      if (typeof st === 'string') return st === 'skip';
      return st.status === 'skip';
    });
  }
  return cards;
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  grid.innerHTML = '';

  const filtered = getFilteredCards();

  // Update header
  const subj = state.activeSubject === 'all'
    ? { label: 'Todas as Fichas', color: '#2C3E50' }
    : getSubjectData(state.activeSubject);
  document.getElementById('active-title').textContent = subj.label || 'Todas as Fichas';
  document.getElementById('active-dot').style.background = subj.color;
  document.getElementById('active-count').textContent = `${filtered.length} fichas`;

  if (filtered.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = `<div class="icon">🎉</div><p>Nenhuma ficha nesta categoria!</p>`;
    grid.appendChild(empty);
    return;
  }

  // Group by subject if showing all
  if (state.activeSubject === 'all') {
    const bySubj = {};
    filtered.forEach(c => {
      if (!bySubj[c.subj]) bySubj[c.subj] = [];
      bySubj[c.subj].push(c);
    });
    Object.entries(bySubj).forEach(([subjId, cards]) => {
      const s = getSubjectData(subjId);
      const sep = document.createElement('div');
      sep.className = 'section-break';
      sep.style.gridColumn = '1 / -1';
      sep.innerHTML = `
        <div style="width:10px;height:10px;border-radius:50%;background:${s.color};flex-shrink:0"></div>
        <span class="section-break-label">${s.icon} ${s.label}</span>
        <div class="section-break-line"></div>
      `;
      grid.appendChild(sep);
      cards.forEach(c => grid.appendChild(buildCard(c)));
    });
  } else {
    filtered.forEach(c => grid.appendChild(buildCard(c)));
  }

  updateStats();
}

function buildCard(card) {
  const s = getSubjectData(card.subj);
  let cardStatus = state.cardStatus[card.id];
  if (typeof cardStatus === 'string') {
    cardStatus = { status: cardStatus, revisoes: 0, ultimaData: null, revisado: false, comentario: '' };
  } else if (!cardStatus) {
    cardStatus = { status: null, revisoes: 0, ultimaData: null, revisado: false, comentario: '' };
  } else {
    if (typeof cardStatus.revisado === 'undefined') cardStatus.revisado = false;
    if (typeof cardStatus.comentario === 'undefined') cardStatus.comentario = '';
  }

  const wrapper = document.createElement('div');
  wrapper.className = 'flashcard';
  wrapper.dataset.id = card.id;

  wrapper.innerHTML = `
    <div class="flashcard-inner">
      <div class="flashcard-face flashcard-front">
        <div class="card-top-bar" style="background:${s.color}"></div>
        <div class="card-body">
          <div class="card-tag">${s.icon} ${card.tag}</div>
          <div class="card-question">${card.q}</div>
        </div>
        <div class="card-footer">
          <span class="card-hint">👆 clique para ver a resposta <span class="flip-icon">↻</span></span>
          <div class="status-dots">
            <div class="status-dot ${cardStatus.status === 'known' ? 'green' : ''}" title="Sei!" data-action="known"></div>
            <div class="status-dot ${cardStatus.status === 'review' ? 'yellow' : ''}" title="Revisar" data-action="review"></div>
            <div class="status-dot ${cardStatus.status === 'skip' ? 'red-dot' : ''}" title="Não sei" data-action="skip"></div>
          </div>
        </div>
        <div class="rev-info" style="font-size:0.7rem;color:var(--text-muted);padding:2px 22px 8px 22px;">
          Revisões: ${cardStatus.revisoes || 0} | Última: ${cardStatus.ultimaData || '-'}
        </div>
      </div>
      <div class="flashcard-face flashcard-back" style="background:${s.color}">
        <div class="card-answer">
          <div class="answer-label">Resposta</div>
          <div class="answer-text">${card.a}</div>
        </div>
        <div style="padding:10px 22px 0 22px;">
          <textarea class="comentario-estudo" placeholder="Comentário de estudo..." style="width:100%;min-height:38px;resize:vertical;border-radius:7px;border:1.2px solid #fff3;padding:6px 8px;font-size:0.95em;">${cardStatus.comentario || ''}</textarea>
        </div>
        <div class="card-back-footer" style="gap:8px;">
          <div class="self-rating">
            <span class="rating-label">Como foi?</span>
            <button class="rating-btn r-easy" data-rating="known">✓ Sei</button>
            <button class="rating-btn" data-rating="review">↻ Revisar</button>
            <button class="rating-btn r-hard" data-rating="skip">✗ Difícil</button>
          </div>
          ${state.activeFilter === 'review' && cardStatus.status === 'review' ? `<button class="revisado-btn" data-revisado>${cardStatus.revisado ? 'Revisado ✓' : 'Marcar revisado'}</button>` : ''}
        </div>
      </div>
    </div>
  `;

  // Comentário de estudo (textarea)
  const comentarioBox = wrapper.querySelector('.comentario-estudo');
  if (comentarioBox) {
    comentarioBox.addEventListener('input', (e) => {
      let st = state.cardStatus[card.id];
      if (typeof st === 'string') st = { status: st, revisoes: 0, ultimaData: null, revisado: false, comentario: '' };
      st.comentario = comentarioBox.value;
      state.cardStatus[card.id] = st;
      saveStatus();
    });
  }
  const revisadoBtn = wrapper.querySelector('[data-revisado]');
  if (revisadoBtn) {
    revisadoBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      let st = state.cardStatus[card.id];
      if (typeof st === 'string') st = { status: st, revisoes: 0, ultimaData: null, revisado: false, comentario: '' };
      st.status = 'revisado';
      st.revisado = true;
      st.revisoes = (st.revisoes || 0) + 1;
      st.ultimaData = new Date().toLocaleDateString('pt-BR');
      state.cardStatus[card.id] = st;
      saveStatus();
      updateStats();
      renderDisciplinasFinalizadas();
      renderCards();
    });
  }
  // Flip on click (but not on buttons)
  wrapper.addEventListener('click', (e) => {
    // Não vira se clicar em botões, inputs, textarea ou controles de revisão
    if (
      e.target.closest('[data-action]') ||
      e.target.closest('[data-rating]') ||
      e.target.closest('[data-revisado]') ||
      e.target.closest('button') ||
      e.target.tagName === 'TEXTAREA' ||
      e.target.tagName === 'INPUT'
    ) return;
    wrapper.classList.toggle('flipped');
  });

  // Status dots (front)
  wrapper.querySelectorAll('[data-action]').forEach(dot => {
    dot.addEventListener('click', (e) => {
      e.stopPropagation();
      const action = dot.dataset.action;
      setCardStatus(card.id, action, wrapper);
    });
  });

  // Rating buttons (back)
  wrapper.querySelectorAll('[data-rating]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const rating = btn.dataset.rating;
      const result = setCardStatus(card.id, rating, wrapper);
      wrapper.classList.remove('flipped');
      if (result === 'cleared') {
        showToast('Status removido!');
      } else {
        showToast(rating === 'known' ? '✓ Marcado como sei!' : rating === 'review' ? '↻ Para revisar' : '✗ Marcado como difícil');
      }
    });
  });

  return wrapper;
}

function setCardStatus(id, status, wrapper) {
  // Inicializa status se não existir
  if (typeof state.cardStatus[id] !== 'object' || state.cardStatus[id] === null) {
    state.cardStatus[id] = { status: null, revisoes: 0, ultimaData: null, revisado: false, comentario: '' };
  }
  // Se já for string (antigo), converte
  if (typeof state.cardStatus[id] === 'string') {
    state.cardStatus[id] = { status: state.cardStatus[id], revisoes: 0, ultimaData: null, revisado: false, comentario: '' };
  }
  // Se clicar no mesmo status, limpa o status
  if (state.cardStatus[id].status === status) {
    state.cardStatus[id].status = null;
    state.cardStatus[id].revisado = false;
    saveStatus();
    wrapper.querySelectorAll('[data-action]').forEach(dot => {
      dot.classList.remove('green', 'yellow', 'red-dot');
    });
    const revInfo = wrapper.querySelector('.rev-info');
    if (revInfo) {
      revInfo.textContent = `Revisões: ${state.cardStatus[id].revisoes || 0} | Última: ${state.cardStatus[id].ultimaData || '-'}`;
    }
    updateStats();
    renderDisciplinasFinalizadas();
    renderCards();
    return 'cleared';
  }
  // Atualiza status
  state.cardStatus[id].status = status;
  state.cardStatus[id].revisado = false;
  saveStatus();
  // Update dots
  wrapper.querySelectorAll('[data-action]').forEach(dot => {
    dot.classList.remove('green', 'yellow', 'red-dot');
    if (dot.dataset.action === 'known' && state.cardStatus[id].status === 'known') dot.classList.add('green');
    if (dot.dataset.action === 'review' && state.cardStatus[id].status === 'review') dot.classList.add('yellow');
    if (dot.dataset.action === 'skip' && state.cardStatus[id].status === 'skip') dot.classList.add('red-dot');
  });
  const revInfo = wrapper.querySelector('.rev-info');
  if (revInfo) {
    revInfo.textContent = `Revisões: ${state.cardStatus[id].revisoes || 0} | Última: ${state.cardStatus[id].ultimaData || '-'}`;
  }
  updateStats();
  renderDisciplinasFinalizadas();
  renderCards();
  return status;
}

function updateStats() {
  const total = CARDS.length;
  const cardValues = Object.values(state.cardStatus).map(v => {
    if (typeof v === 'string') return { status: v };
    return v || {};
  });
  const known = cardValues.filter(v => v.status === 'known').length;
  const review = cardValues.filter(v => v.status === 'review').length;
  const seen = cardValues.filter(v => v.status).length;

  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-ok').textContent = known;
  document.getElementById('stat-rev').textContent = review;
  document.getElementById('prog-label').textContent = `${seen} de ${total} fichas revisadas`;
  document.getElementById('prog-fill').style.width = `${(seen / total) * 100}%`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

const loginScreen = document.getElementById('login-screen');
const conteudoApp = document.getElementById('conteudo-app');

loginForm.addEventListener('submit', function(e) {
  e.preventDefault();
  if (senhaInput.value === senhaCorreta) {
    loginScreen.style.display = 'none';
    conteudoApp.style.display = '';
    buildNav();
    buildFilters();
    renderCards();
    updateStats();
    renderDisciplinasFinalizadas();
    setupNovaFicha();
    setupDisciplinaAddRemove();
  } else {
    senhaErro.style.display = 'block';
    senhaInput.value = '';
    senhaInput.focus();
  }
});
